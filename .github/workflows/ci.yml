name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Install Tectonic (LaTeX renderer for render tests)
        run: |
          curl -fsSL https://drop-sh.fullyjustified.net | sh
          sudo mv tectonic /usr/local/bin/tectonic
          tectonic --version
      - name: Cache Tectonic bundle
        uses: actions/cache@v4
        with:
          path: ~/.cache/Tectonic
          key: tectonic-bundle-${{ runner.os }}
      - name: Compile
        run: ./mvnw -B compile
      - name: Test
        run: ./mvnw -B test
      - name: Spotless check
        run: ./mvnw -B spotless:check

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Type check
        run: npx tsc -b --noEmit
      - name: Audit (high severity)
        # Non-blocking: react-router's current advisory (GHSA-qwww-vcr4-c8h2) is an RSC-mode CSRF
        # bypass, and this app is a plain client-side SPA that never enables RSC mode. Kept visible
        # in CI logs so a future, actually-applicable advisory doesn't go unnoticed.
        run: npm audit --audit-level=high
        continue-on-error: true
      - name: Build
        run: npm run build
