spring:
  application:
    name: career-copilot
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/careercopilot}
    username: ${SPRING_DATASOURCE_USERNAME:careercopilot}
    password: ${SPRING_DATASOURCE_PASSWORD:careercopilot}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  ai:
    model:
      chat: openai
      embedding: ollama
    ollama:
      base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
      init:
        pull-model-strategy: never
      embedding:
        options:
          model: ${EMBEDDING_MODEL:nomic-embed-text}
    openai:
      # OpenRouter is OpenAI-compatible; used for chat in both dev and prod.
      base-url: ${OPENROUTER_BASE_URL:https://openrouter.ai/api}
      api-key: ${OPENROUTER_API_KEY:}

management:
  endpoints:
    web:
      exposure:
        include: health

jwt:
  secret: ${JWT_SECRET}
  expiry-seconds: ${JWT_EXPIRY_SECONDS:86400}

cors:
  allowed-origin: ${CORS_ALLOWED_ORIGIN:http://localhost:5173}

embedding:
  dimension: ${EMBEDDING_DIMENSION:768}
  retry-cron: ${EMBEDDING_RETRY_CRON:0 */10 * * * *}

llm:
  tiers:
    EXTRACTION:
      # Free OpenRouter model with native structured-output support (Claude API expired).
      model: ${LLM_EXTRACTION_MODEL:google/gemma-4-31b-it:free}
      max-tokens: 1500
      temperature: 0.2
    TAILORING:
      # Free OpenRouter model; gpt-oss-120b advertises reliable structured JSON output.
      model: ${LLM_TAILORING_MODEL:openai/gpt-oss-120b:free}
      max-tokens: 2500
      temperature: 0.4
    SCORING_AUGMENTATION:
      model: ${LLM_EXTRACTION_MODEL:google/gemma-4-31b-it:free}
      max-tokens: 1500
      temperature: 0.2
    COVER_LETTER:
      model: ${LLM_TAILORING_MODEL:openai/gpt-oss-120b:free}
      max-tokens: 1200
      temperature: 0.5

scoring:
  near-miss-threshold: ${SCORING_NEARMISS_THRESHOLD:0.75}
  semantic-augmentation-enabled: ${SCORING_SEMANTIC_ENABLED:true}

careercopilot:
  intel:
    min-aggregation-threshold: ${INTEL_MIN_AGGREGATION:3}
    llm-assist-enabled: ${INTEL_LLM_ASSIST_ENABLED:false}

tailoring:
  retrieval-top-k: ${RETRIEVAL_TOP_K:6}
  tectonic:
    binary: ${TECTONIC_BINARY:tectonic}
    timeout-seconds: ${TECTONIC_TIMEOUT_SECONDS:30}

jobs:
  ingestion:
    cron: ${JOBS_INGESTION_CRON:0 0 */12 * * *}
  freshness:
    max-age-days: ${JOBS_FRESHNESS_MAX_AGE_DAYS:45}
    sweep-cron: ${JOBS_FRESHNESS_SWEEP_CRON:0 30 * * * *}
  adapters:
    enabled: ${JOBS_ADAPTERS_ENABLED:REMOTEOK,GREENHOUSE,LEVER,ASHBY,ADZUNA,JOOBLE}
  # Best-effort fetch of the real description from a posting's URL when the source (Adzuna,
  # Jooble) only returned a short search-result snippet.
  enrichment:
    enabled: ${JOBS_ENRICHMENT_ENABLED:true}
    timeout-seconds: ${JOBS_ENRICHMENT_TIMEOUT_SECONDS:6}
    max-length: ${JOBS_ENRICHMENT_MAX_LENGTH:8000}
  # Locations searched per role by the query-driven aggregators.
  search-locations: ${JOBS_SEARCH_LOCATIONS:India,Remote}
  # Curated role presets. key -> {label, keywords}. Keywords drive aggregator search AND role tagging.
  roles:
    ai-ml-engineer:
      label: "AI / ML Engineer"
      keywords: ${JOBS_ROLE_AI_ML_KEYWORDS:machine learning,ml engineer,ai engineer,applied scientist,research scientist,deep learning,llm,genai}
    software-engineer:
      label: "Software Engineer"
      keywords: ${JOBS_ROLE_SWE_KEYWORDS:software engineer,software development engineer,backend engineer,full stack,platform engineer}
    data-scientist:
      label: "Data Scientist / Analyst"
      keywords: ${JOBS_ROLE_DS_KEYWORDS:data scientist,data analyst,analytics engineer}
    quant:
      label: "Quant / Trading"
      keywords: ${JOBS_ROLE_QUANT_KEYWORDS:quantitative developer,quantitative researcher,quant,trading systems,hft}
  targets:
    # Only postings whose title matches a keyword below are ingested. Empty list = keep everything.
    title-keywords: ${JOBS_TARGET_TITLE_KEYWORDS:machine learning,ml engineer,ai engineer,applied scientist,deep learning,llm,genai,software engineer,software development engineer,backend engineer,platform engineer,systems engineer,quantitative developer,quantitative researcher,quant,hft,trading systems}
    # Kept only if remote OR location matches a term below. Empty list = no location filter.
    location-terms: ${JOBS_TARGET_LOCATION_TERMS:india,bengaluru,bangalore,hyderabad,pune,delhi,gurgaon,gurugram,noida,mumbai,chennai,remote,singapore,japan,tokyo}
    # A "remote" posting whose location names one of these countries/regions (and none of the
    # location-terms above) is remote-but-restricted-to-that-country's-candidates, e.g. "Remote -
    # USA" — not actually open to ours. Such postings are dropped instead of kept.
    remote-restricted-terms: ${JOBS_TARGET_REMOTE_RESTRICTED_TERMS:usa,us,united states,canada,uk,united kingdom,brazil,israel,china,germany,france,sweden,argentina,ireland,denmark,australia,mexico,poland,spain,italy,netherlands}
    # Reserved for future ranking; not a hard filter in v1.
    experience-terms: ${JOBS_TARGET_EXPERIENCE_TERMS:intern,new grad,new-grad,graduate,entry level,entry-level,junior,associate}
  remoteok:
    base-url: ${REMOTEOK_BASE_URL:https://remoteok.com}
  greenhouse:
    base-url: ${GREENHOUSE_BASE_URL:https://boards-api.greenhouse.io}
    companies: ${GREENHOUSE_COMPANIES:databricks,gitlab,stripe,coinbase,airbnb,razorpay,postman,freshworks,zerodha,credavenue}
  lever:
    base-url: ${LEVER_BASE_URL:https://api.lever.co}
    companies: ${LEVER_COMPANIES:voleon,hudsonrivertrading,spotify}
  ashby:
    base-url: ${ASHBY_BASE_URL:https://api.ashbyhq.com}
    companies: ${ASHBY_COMPANIES:ramp,notion,linear,openai,mistral}
  adzuna:
    base-url: ${ADZUNA_BASE_URL:https://api.adzuna.com}
    app-id: ${ADZUNA_APP_ID:}
    app-key: ${ADZUNA_APP_KEY:}
    country: ${ADZUNA_COUNTRY:in}
    results-per-page: ${ADZUNA_RESULTS_PER_PAGE:50}
    page-cap: ${ADZUNA_PAGE_CAP:2}
    currency: ${ADZUNA_CURRENCY:INR}
  jooble:
    base-url: ${JOOBLE_BASE_URL:https://jooble.org}
    api-key: ${JOOBLE_API_KEY:}
    page-cap: ${JOOBLE_PAGE_CAP:1}
