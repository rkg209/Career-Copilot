spring:
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration
  ai:
    model:
      # A real ChatModel bean must exist so LlmGateway's ChatClient.Builder is autoconfigured,
      # but LlmGateway is mocked in all tests — no chat call ever leaves the JVM.
      chat: openai
      embedding: ollama
    ollama:
      base-url: http://localhost:11434
      init:
        pull-model-strategy: never
      embedding:
        options:
          model: nomic-embed-text
    openai:
      base-url: http://localhost:9999
      api-key: test-key-never-used

jwt:
  secret: test-jwt-signing-secret-not-for-production-use-only-32bytes-min
  expiry-seconds: 86400

# Scheduled ingestion cron is 6-hourly and never fires within a test run; the ingestion integration
# test drives a stub adapter directly. Disable any live source by default here as defence-in-depth.
# Retry sweep cron never fires in tests (Feb 31); EmbeddingGateway is mocked in all tests.
embedding:
  dimension: 768
  retry-cron: "0 0 5 31 2 ?"

jobs:
  adapters:
    enabled: MANUAL_PASTE
  ingestion:
    cron: "0 0 5 31 2 ?"

# LlmGateway is mocked in all tests; tier values only satisfy config binding.
llm:
  tiers:
    EXTRACTION:
      model: test-extraction-model
      max-tokens: 1500
      temperature: 0.2
    TAILORING:
      model: test-tailoring-model
      max-tokens: 2500
      temperature: 0.4
    SCORING_AUGMENTATION:
      model: test-extraction-model
      max-tokens: 1500
      temperature: 0.2
    COVER_LETTER:
      model: test-tailoring-model
      max-tokens: 1200
      temperature: 0.5

tailoring:
  retrieval-top-k: 6
  tectonic:
    binary: tectonic
    timeout-seconds: 30
